name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: "PHP lint: PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t 13.4 -s composerUpdateMax
      - name: Lint PHP
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -s lintPhp

  # Runs on the one combination that installs everything, EXT:index included: static analysis needs
  # the optional classes that the code only uses when present. TYPO3 12.4 and PHP 8.2 compatibility
  # is covered by the unit and functional tests.
  code-quality:
    name: "Code quality: ${{ matrix.command }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        command: ['cgl', 'composerNormalize', 'phpstan']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p 8.3 -t 13.4 -s composerUpdateMax
      - name: Run ${{ matrix.command }}
        run: Build/Scripts/runTests.sh -b docker -p 8.3 -t 13.4 -n -s ${{ matrix.command }}

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run shellcheck
        run: Build/Scripts/runTests.sh -b docker -s shellcheck

  unit-tests:
    name: "Unit tests: PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }}, ${{ matrix.composer-dependencies }} deps"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['12.4', '13.4']
        php-version: ['8.2', '8.3', '8.4', '8.5']
        composer-dependencies: ['Min', 'Max']
        exclude:
          # PHP 8.5 is not officially supported by TYPO3 12.4
          - typo3-version: '12.4'
            php-version: '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdate${{ matrix.composer-dependencies }}
      - name: Run unit tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s unit

  functional-tests:
    name: "Functional tests: PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }}, ${{ matrix.dbms }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['12.4', '13.4']
        php-version: ['8.2', '8.3', '8.4', '8.5']
        dbms: ['sqlite', 'mariadb', 'mysql', 'postgres']
        exclude:
          - typo3-version: '12.4'
            php-version: '8.3'
          - typo3-version: '12.4'
            php-version: '8.5'
          - typo3-version: '13.4'
            php-version: '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdateMax
      - name: Run functional tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -d ${{ matrix.dbms }} -s functional
