name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: "PHP lint: PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t 14.3 -s composerUpdateMax
      - name: Lint PHP
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -s lintPhp

  # Runs on installs with EXT:index (PHP 8.3+): static analysis needs the optional classes that the
  # code only uses when present. PHPStan runs against both TYPO3 versions, because the code calls
  # v14 APIs behind version checks (see Build/phpstan/typo3-version.php). PHP 8.2 compatibility is
  # covered by the unit and functional tests.
  code-quality:
    name: "Code quality: ${{ matrix.command }}, TYPO3 ${{ matrix.typo3-version }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: 'cgl'
            typo3-version: '14.3'
            php-version: '8.4'
          - command: 'composerNormalize'
            typo3-version: '14.3'
            php-version: '8.4'
          - command: 'phpstan'
            typo3-version: '13.4'
            php-version: '8.3'
          - command: 'phpstan'
            typo3-version: '14.3'
            php-version: '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdateMax
      - name: Run ${{ matrix.command }}
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -n -s ${{ matrix.command }}

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run shellcheck
        run: Build/Scripts/runTests.sh -b docker -s shellcheck

  unit-tests:
    name: "Unit tests: PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }}, ${{ matrix.composer-dependencies }} deps"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['13.4', '14.3']
        php-version: ['8.2', '8.3', '8.4', '8.5']
        composer-dependencies: ['Min', 'Max']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdate${{ matrix.composer-dependencies }}
      - name: Run unit tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s unit

  # Each TYPO3 version on its lowest PHP version (without EXT:index) and its highest (with EXT:index).
  functional-tests:
    name: "Functional tests: PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }}, ${{ matrix.dbms }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        typo3-version: ['13.4', '14.3']
        php-version: ['8.2', '8.5']
        dbms: ['sqlite', 'mariadb', 'mysql', 'postgres']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -s composerUpdateMax
      - name: Run functional tests
        run: Build/Scripts/runTests.sh -b docker -p ${{ matrix.php-version }} -t ${{ matrix.typo3-version }} -d ${{ matrix.dbms }} -s functional
