<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="content">
<h1>Single View for Session</h1>

<f:flashMessages />
<f:render partial="Session/Export" arguments="{exportFields:exportFields,session:session}" />
  <div class="panel panel-space panel-default">
    <div class="panel-heading">
			{session.sessionId}
    </div>
    <div class="table-fit">
      <table class="table table-striped table-hover">
        <tr>
          <td colspan="3">
            <f:link.action class="btn btn-default" action="delete" arguments="{session:session}" title="Delete Task">
              <core:icon identifier="actions-edit-delete"/> Delete session
            </f:link.action>
            <f:link.action class="btn btn-default" action="list" title="Close">
              <core:icon identifier="actions-close"/> Close
            </f:link.action>
          </td>
        </tr>
        <f:render partial="Session/Properties" arguments="{session:session,messages:messages}"/>
      </table>
  </div>
  </div>
	<div class="help-block text-right">
		<strong>{session.sessionId}</strong>  <span class="typo3-TCEforms-recUid">[{session.uid}]</span>
	</div>
</f:section>
</html>
