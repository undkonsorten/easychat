<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
			xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:be.pageRenderer includeJavaScriptModules="{0: '@typo3/backend/record-download-button.js'}" />
<f:if condition="{session}">
	<f:then>
		<f:variable name="exportUrl"><f:uri.action action="exportSettings" arguments="{sessionUid: session.uid}"/></f:variable>
		<f:variable name="exportSubject"><f:translate key="export.headline.single"/></f:variable>
	</f:then>
	<f:else>
		<f:variable name="exportUrl"><f:uri.action action="exportSettings"/></f:variable>
		<f:variable name="exportSubject"><f:translate key="export.headline"/></f:variable>
	</f:else>
</f:if>
<typo3-recordlist-record-download-button
	class="btn btn-default"
	url="{exportUrl}"
	subject="{exportSubject}"
	ok="{f:translate(key: 'export.submit')}"
	close="{f:translate(key: 'LLL:EXT:core/Resources/Private/Language/locallang_core.xlf:labels.cancel')}"
	title="{exportSubject}"
>
	<core:icon identifier="actions-download"/> <f:translate key="export.submit"/>
</typo3-recordlist-record-download-button>
</html>
