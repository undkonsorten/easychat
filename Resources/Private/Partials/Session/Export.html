<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
			xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<div class="panel panel-space panel-default">
	<div class="panel-heading">
		<core:icon identifier="actions-download"/>
		<f:if condition="{session}">
			<f:then><f:translate key="export.headline.single"/></f:then>
			<f:else><f:translate key="export.headline"/></f:else>
		</f:if>
	</div>
	<div class="panel-body">
		<f:form action="export" controller="Session" method="get" target="_blank">
			<f:if condition="{session}">
				<f:form.hidden name="sessionUid" value="{session.uid}" />
			</f:if>
			<p>{f:translate(key:'export.hint')}</p>
			<f:for each="{exportFields}" as="label" key="field">
				<div class="form-check form-check-inline">
					<f:form.checkbox class="form-check-input" id="export-field-{field}" name="fields" value="{field}" multiple="1" checked="1" />
					<label class="form-check-label" for="export-field-{field}"><f:translate key="export.field.{field}" default="{label}"/></label>
				</div>
			</f:for>
			<div class="mt-2">
				<button type="submit" class="btn btn-default">
					<core:icon identifier="actions-download"/> <f:translate key="export.submit"/>
				</button>
			</div>
		</f:form>
	</div>
</div>
</html>
