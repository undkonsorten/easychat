services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Undkonsorten\Easychat\:
    resource: '../Classes/*'


  Undkonsorten\Easychat\Command\DeleteSessionsCommand:
    tags:
      - name: 'console.command'
        command: 'easychat:delete-sessions'
        description: 'Deletes sessions older than given date interval.'

  # Renders EXT:index's Frontend technology as an anonymous visitor, so hidden and scheduled
  # content never reaches the vector store (see the class). Ignored without EXT:index.
  Undkonsorten\Easychat\Indexing\GuestFrontendContextBuilder:
    decorates: Lochmueller\Index\Indexing\Frontend\FrontendContextBuilder
    decoration_on_invalid: ignore
    arguments:
      $inner: '@.inner'

  # TYPO3 core instantiates FormDataProviders via GeneralUtility::makeInstance()
  # without constructor arguments, bypassing constructor injection unless the
  # service is public in the DI container.
  Undkonsorten\Easychat\FormDataProvider\ModelValuePickerDataProvider:
    public: true
